name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build release APKs (full + lite)
        run: ./gradlew assembleFullRelease assembleLiteRelease test

      - name: Upload release APKs (артефакт прогона)
        uses: actions/upload-artifact@v4
        with:
          name: bt_manager-release-apks
          path: |
            app/build/outputs/apk/full/release/bt_manager-full-release.apk
            app/build/outputs/apk/lite/release/bt_manager-lite-release.apk

      # Релиз появляется только на тегах v1.0, v1.1…:
      # git tag v1.1 && git push --tags
      - name: Create GitHub Release (на теги v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/full/release/bt_manager-full-release.apk
            app/build/outputs/apk/lite/release/bt_manager-lite-release.apk
          generate_release_notes: true
